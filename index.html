<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Stem-Education-Courses/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="CodeSmartNG STEM - Interactive STEM Education Platform" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>CodeSmartNG STEM - Interactive STEM Education Platform</title>

    <style>
      /* ========================================
         LOADING SCREEN STYLES
         ======================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
      }

      body {
        font-family:
          "Segoe UI",
          Tahoma,
          Geneva,
          Verdana,
          sans-serif;

        background:
          linear-gradient(
            135deg,
            #667eea 0%,
            #764ba2 100%
          );

        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* Loading Screen */
      .loading-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }

      .loading-container {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        animation: fadeIn 0.5s ease-out;
      }

      /* Particles */
      .loading-particles {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 8s ease-in-out infinite;
        backdrop-filter: blur(2px);
      }

      .particle:nth-child(1) {
        top: 10%;
        left: 10%;
        width: 12px;
        height: 12px;
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        top: 20%;
        right: 15%;
        animation-delay: 1s;
      }
      .particle:nth-child(3) {
        bottom: 30%;
        left: 20%;
        animation-delay: 2s;
        width: 10px;
        height: 10px;
      }
      .particle:nth-child(4) {
        bottom: 20%;
        right: 10%;
        animation-delay: 3s;
        width: 6px;
        height: 6px;
      }
      .particle:nth-child(5) {
        top: 50%;
        left: 5%;
        animation-delay: 4s;
        width: 14px;
        height: 14px;
      }
      .particle:nth-child(6) {
        top: 60%;
        right: 5%;
        animation-delay: 5s;
      }
      .particle:nth-child(7) {
        bottom: 10%;
        left: 50%;
        animation-delay: 6s;
        width: 10px;
        height: 10px;
      }
      .particle:nth-child(8) {
        top: 40%;
        left: 50%;
        animation-delay: 7s;
        width: 6px;
        height: 6px;
      }
      .particle:nth-child(9) {
        top: 80%;
        left: 30%;
        animation-delay: 1.5s;
        width: 12px;
        height: 12px;
      }
      .particle:nth-child(10) {
        bottom: 60%;
        right: 20%;
        animation-delay: 3.5s;
      }

      /* Icon */
      .loading-icon {
        font-size: 4.5rem;
        margin-bottom: 1rem;
        display: block;
        padding: 20px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        animation: bounce 2s ease-in-out infinite;
      }

      /* Spinner */
      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }

      /* Title */
      .loading-title {
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .loading-subtitle {
        font-size: 1rem;
        opacity: 0.9;
        margin-bottom: 0.5rem;
        font-weight: 300;
        color: rgba(255, 255, 255, 0.8);
      }

      /* Dots */
      .loading-dots {
        display: inline-block;
        font-size: 1.5rem;
        letter-spacing: 4px;
        color: white;
      }

      .loading-dots span {
        display: inline-block;
        animation: dots 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* Progress */
      .loading-progress {
        width: 250px;
        height: 4px;
        margin-top: 1.5rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        overflow: hidden;
      }

      .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #818cf8, #c084fc, #f472b6);
        border-radius: 2px;
        animation: progress 2.5s ease-in-out infinite;
      }

      /* Version */
      .loading-version {
        margin-top: 2rem;
        font-size: 0.7rem;
        opacity: 0.5;
        color: white;
        letter-spacing: 1px;
        font-weight: 300;
        background: rgba(255, 255, 255, 0.05);
        padding: 4px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Animations */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes dots {
        0%,
        80%,
        100% {
          opacity: 0;
        }
        40% {
          opacity: 1;
        }
      }

      @keyframes progress {
        0% {
          width: 0%;
        }
        30% {
          width: 40%;
        }
        60% {
          width: 75%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes float {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(30px, -20px) scale(1.2);
        }
        50% {
          transform: translate(-20px, 30px) scale(0.8);
        }
        75% {
          transform: translate(20px, 10px) scale(1.1);
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .loading-title {
          font-size: 1.8rem;
        }
        .loading-icon {
          font-size: 3.5rem;
          padding: 15px;
        }
        .loading-spinner {
          width: 50px;
          height: 50px;
        }
        .loading-progress {
          width: 200px;
        }
      }

      @media (max-width: 480px) {
        .loading-title {
          font-size: 1.5rem;
        }
        .loading-icon {
          font-size: 2.8rem;
          padding: 12px;
        }
        .loading-spinner {
          width: 40px;
          height: 40px;
        }
        .loading-subtitle {
          font-size: 0.875rem;
        }
        .loading-progress {
          width: 160px;
        }
        .loading-version {
          font-size: 0.6rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner,
        .loading-icon,
        .loading-progress-bar,
        .loading-dots span,
        .particle {
          animation: none !important;
        }
        .loading-progress-bar {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- React Application Root -->
    <div id="root">
      <!-- Initial Loading Screen -->
      <div class="loading-screen">
        <div class="loading-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>

        <div class="loading-container">
          <div class="loading-icon">📚</div>
          <div class="loading-spinner"></div>
          <h1 class="loading-title">CodeSmartNG STEM</h1>
          <p class="loading-subtitle">Loading your learning experience...</p>
          <div class="loading-dots">
            <span>.</span>
            <span>.</span>
            <span>.</span>
          </div>
          <div class="loading-progress">
            <div class="loading-progress-bar"></div>
          </div>
          <p class="loading-version">v1.0.0 • STEM Education Platform</p>
        </div>
      </div>
    </div>

    <!-- ✅ Vite will inject the correct script during build -->
    <!-- For development, Vite uses this: -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
