<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>CodeSmartNG Stem - Interactive STEM Education Platform</title>
    <meta name="title" content="CodeSmartNG Stem - Interactive STEM Education Platform" />
    <meta name="description" content="Learn programming, science, and technology with CodeSmartNG. Interactive STEM courses for students and teachers. Start your learning journey today!" />
    <meta name="keywords" content="STEM education, programming, coding, science, technology, engineering, mathematics, online learning, CodeSmartNG" />
    <meta name="author" content="CodeSmartNG" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta property="og:title" content="CodeSmartNG Stem - Interactive STEM Education Platform" />
    <meta property="og:description" content="Learn programming, science, and technology with CodeSmartNG. Interactive STEM courses for students and teachers." />
    <meta property="og:image" content="https://yourdomain.com/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourdomain.com/" />
    <meta property="twitter:title" content="CodeSmartNG Stem - Interactive STEM Education Platform" />
    <meta property="twitter:description" content="Learn programming, science, and technology with CodeSmartNG. Interactive STEM courses for students and teachers." />
    <meta property="twitter:image" content="https://yourdomain.com/social-preview.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
      /* ========================================
         LOADING SCREEN STYLES
         ======================================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
      }

      #root {
        width: 100%;
        max-width: 1200px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        animation: fadeIn 0.5s ease-out;
      }

      /* Logo / Icon */
      .loading-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: bounce 2s ease-in-out infinite;
        display: block;
      }

      /* Loading Spinner */
      .loading-spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top: 4px solid white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 1.5rem;
      }

      /* Loading Text */
      .loading-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        letter-spacing: -0.5px;
      }

      .loading-subtitle {
        font-size: 1rem;
        opacity: 0.8;
        margin-bottom: 0.5rem;
        font-weight: 300;
      }

      .loading-dots {
        display: inline-block;
        font-size: 1.2rem;
        letter-spacing: 4px;
      }

      .loading-dots span {
        display: inline-block;
        animation: dots 1.4s ease-in-out infinite;
      }

      .loading-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }

      /* Loading Progress Bar */
      .loading-progress {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
        margin-top: 1rem;
        overflow: hidden;
      }

      .loading-progress-bar {
        height: 100%;
        width: 0%;
        background: white;
        border-radius: 2px;
        animation: progress 2s ease-in-out infinite;
      }

      /* Loading Particles */
      .loading-particles {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: -1;
      }

      .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        animation: float 8s ease-in-out infinite;
      }

      .particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
      .particle:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
      .particle:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 2s; }
      .particle:nth-child(4) { bottom: 20%; right: 10%; animation-delay: 3s; }
      .particle:nth-child(5) { top: 50%; left: 5%; animation-delay: 4s; }
      .particle:nth-child(6) { top: 60%; right: 5%; animation-delay: 5s; }
      .particle:nth-child(7) { bottom: 10%; left: 50%; animation-delay: 6s; }
      .particle:nth-child(8) { top: 40%; left: 50%; animation-delay: 7s; }

      /* ========================================
         ANIMATIONS
         ======================================== */

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes dots {
        0%, 80%, 100% { opacity: 0; }
        40% { opacity: 1; }
      }

      @keyframes progress {
        0% { width: 0%; }
        50% { width: 70%; }
        100% { width: 100%; }
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        25% { transform: translate(30px, -20px) scale(1.2); }
        50% { transform: translate(-20px, 30px) scale(0.8); }
        75% { transform: translate(20px, 10px) scale(1.1); }
      }

      /* ========================================
         RESPONSIVE DESIGN
         ======================================== */

      @media (max-width: 640px) {
        .loading-title {
          font-size: 1.5rem;
        }

        .loading-icon {
          font-size: 3rem;
        }

        .loading-spinner {
          width: 40px;
          height: 40px;
        }

        .loading-progress {
          width: 150px;
        }
      }

      @media (max-width: 400px) {
        .loading-title {
          font-size: 1.25rem;
        }

        .loading-icon {
          font-size: 2.5rem;
        }

        .loading-subtitle {
          font-size: 0.875rem;
        }
      }

      /* ========================================
         DARK MODE SUPPORT (for loading screen)
         ======================================== */

      @media (prefers-color-scheme: dark) {
        body {
          background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        }

        .loading-spinner {
          border-color: rgba(255, 255, 255, 0.15);
          border-top-color: #818cf8;
        }

        .loading-progress {
          background: rgba(255, 255, 255, 0.1);
        }

        .loading-progress-bar {
          background: #818cf8;
        }

        .particle {
          background: rgba(129, 140, 248, 0.1);
        }
      }

      /* ========================================
         REDUCED MOTION
         ======================================== */

      @media (prefers-reduced-motion: reduce) {
        .loading-spinner,
        .loading-icon,
        .loading-progress-bar,
        .loading-dots span,
        .particle {
          animation: none !important;
        }

        .loading-container {
          animation: none !important;
        }

        .loading-progress-bar {
          width: 100% !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="root">
      <div class="loading-container">
        <!-- Floating Particles -->
        <div class="loading-particles">
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
        </div>

        <!-- Loading Icon -->
        <span class="loading-icon">📚</span>

        <!-- Spinner -->
        <div class="loading-spinner"></div>

        <!-- Title -->
        <h1 class="loading-title">CodeSmartNG Stem</h1>
        <p class="loading-subtitle">Loading your learning experience...</p>

        <!-- Animated Dots -->
        <div class="loading-dots">
          <span>.</span>
          <span>.</span>
          <span>.</span>
        </div>

        <!-- Progress Bar -->
        <div class="loading-progress">
          <div class="loading-progress-bar"></div>
        </div>

        <!-- Version -->
        <p style="margin-top: 2rem; font-size: 0.7rem; opacity: 0.4; color: white;">
          v1.0.0 • STEM Education Platform
        </p>
      </div>
    </div>

    <!-- App Script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
